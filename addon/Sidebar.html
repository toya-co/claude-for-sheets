<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root { --fg:#202124; --muted:#5f6368; --line:#dadce0; --accent:#1a73e8;
              --ok:#1e8e3e; --bad:#d93025; --warn-bg:#fef7e0; --warn-fg:#7c5800; }
      * { box-sizing: border-box; }
      body { font:13px/1.55 -apple-system, system-ui, "Segoe UI", sans-serif;
             color:var(--fg); margin:0; height:100vh; display:flex; flex-direction:column; }
      header { padding:8px 12px; border-bottom:1px solid var(--line);
               display:flex; align-items:center; gap:8px; flex:0 0 auto; }
      .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); }
      .dot.on { background:var(--ok); }
      .status { font-size:12px; color:var(--muted); flex:1; }
      .link { font-size:12px; color:var(--accent); cursor:pointer; text-decoration:underline; }
      main { flex:1 1 auto; overflow-y:auto; padding:12px; }
      footer { flex:0 0 auto; border-top:1px solid var(--line); padding:10px 12px; }

      .msg { margin-bottom:12px; }
      .msg.user { color:var(--muted); }
      .msg.user b { color:var(--fg); }
      .bubble { white-space:pre-wrap; word-break:break-word; }
      .op { background:#f8f9fa; border:1px solid var(--line); border-left:3px solid var(--accent);
            border-radius:4px; padding:6px 8px; margin-top:6px; font-size:12px; }
      .op.done { border-left-color:var(--ok); }
      .op.err  { border-left-color:var(--bad); }
      .op .a1 { font-family:ui-monospace, monospace; }
      .op.ask  { border-left-color:var(--warn-fg); background:var(--warn-bg); }
      .op .why { color:var(--muted); }
      .op button { font:inherit; font-size:11px; padding:2px 8px; margin-top:4px;
                   border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; }
      .banner { background:var(--warn-bg); color:var(--warn-fg); padding:8px 10px;
                border-radius:6px; font-size:12px; margin-bottom:12px; }
      textarea { width:100%; font:inherit; padding:8px; border:1px solid var(--line);
                 border-radius:6px; resize:vertical; min-height:52px; }
      .row { display:flex; gap:8px; align-items:center; margin-top:8px; }
      .spacer { flex:1 1 auto; }
      button.send { font:inherit; padding:6px 14px; border-radius:6px; border:1px solid var(--accent);
                    background:var(--accent); color:#fff; cursor:pointer; }
      button.send:disabled { opacity:.5; cursor:not-allowed; }
      .hist { font-size:12px; }
      .hist .item { padding:6px 0; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
      .hist .a1 { font-family:ui-monospace, monospace; flex:1; }
      .hist .undone { color:var(--muted); text-decoration:line-through; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <span class="status" id="status">checking local app…</span>
      <span class="link" id="newChat">New chat</span>
      <span class="link" id="toggleHist">History</span>
    </header>

    <main>
      <div class="banner" id="banner">
        Claude reads and edits this sheet with live tools — values, formulas,
        formatting, rows, columns, and tabs. Every change is its own undo entry,
        and anything destructive asks first.
      </div>
      <div id="log"></div>
      <div class="hist" id="hist" style="display:none"></div>
    </main>

    <footer>
      <textarea id="prompt" placeholder="Ask Claude to change this sheet…"></textarea>
      <div class="row">
        <span class="status" id="hint"></span>
        <span class="spacer"></span>
        <button class="send" id="send">Send</button>
      </div>
    </footer>

    <script>
      const DAEMON = 'https://localhost:8443';
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s == null ? '' : s)
        .replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

      let ctx = null;

      function addMsg(cls, html) {
        const d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.innerHTML = html;
        $('log').appendChild(d);
        d.scrollIntoView({ block: 'end' });
        return d;
      }

      // ---- daemon status ----------------------------------------------------
      async function checkDaemon() {
        try {
          const r = await fetch(DAEMON + '/ping');
          const j = await r.json();
          $('dot').classList.add('on');
          $('status').textContent = j.credentialReady
            ? 'local app connected'
            : 'local app up — Claude Code not signed in';
          return true;
        } catch {
          // No web page can start a local process, so this state is a dead end
          // unless the message is actionable. Name the app, say how to start
          // it, and link to the page that explains the rest.
          $('dot').classList.remove('on');
          $('status').innerHTML = 'local app not running — ' +
            '<a href="https://localhost:8443/" target="_blank" rel="noopener">open it</a>' +
            ', or run <code>npm start</code>';
          return false;
        }
      }

      // ---- the tool loop ----------------------------------------------------
      //
      // Claude's tool calls arrive over the turn's SSE stream as
      // {type:'tool_call', callId, name, args}: the daemon is only a relay, and
      // this sidebar is the executor. Whatever happens — result, refusal, user
      // skipping a gated write — is POSTed back to /op-result under the callId,
      // and the model's turn resumes with that answer.
      //
      // The confirmation gate stays in Apps Script (Ops.gs), exactly as before.
      // This code just renders the question when applyOps stops to ask.

      // Each entry turns a tool call's args into an op envelope, plus what to
      // show while it runs. Structural tools address rows/columns/tabs rather
      // than an a1 range, hence builders instead of a fixed field mapping.
      const span = (a) => a.count > 1 ? a.index + '-' + (a.index + a.count - 1) : a.index;
      // How much the confirmation gate asks about, sent by the daemon at the
      // start of every turn. It is the user's own setting, made in the
      // dashboard — never anything the model said — and Apps Script re-checks
      // it at apply time regardless of what is passed here.
      let askBefore = 'destructive';

      // What Claude last read, and when — the basis of every write's guard.
      //
      // Apps Script re-hashes this region inside the same execution as the
      // write, so a human typing between Claude's read and its write aborts the
      // write instead of being silently overwritten. `since` additionally
      // catches edits outside the region, via the onEdit marker.
      //
      // Refreshed from every applyOps response, because our own writes change
      // the region too and must not trip the check.
      let guardState = null;

      function rememberRead(c) {
        guardState = {
          sheetName: c.active.sheetName,
          a1: c.active.a1,
          hash: c.active.contextHash,
          since: c.editWatermark ? c.editWatermark.at : Date.now(),
        };
      }

      const TOOL_OPS = {
        set_values:     (a) => ({ op: { type: 'setValues', sheetName: a.sheetName, a1: a.a1, values: a.values },
                                  verb: 'writing', where: a.sheetName + '!' + a.a1 }),
        set_formulas:   (a) => ({ op: { type: 'setFormulas', sheetName: a.sheetName, a1: a.a1, formulas: a.formulas },
                                  verb: 'writing', where: a.sheetName + '!' + a.a1 }),
        set_formats:    (a) => ({ op: { type: 'setFormats', sheetName: a.sheetName, a1: a.a1, format: a.format },
                                  verb: 'formatting', where: a.sheetName + '!' + a.a1 }),
        clear_range:    (a) => ({ op: { type: 'clear', sheetName: a.sheetName, a1: a.a1, what: a.what },
                                  verb: 'clearing', where: a.sheetName + '!' + a.a1 }),
        insert_rows:    (a) => ({ op: { type: 'insertRows', sheetName: a.sheetName, index: a.index, count: a.count || 1 },
                                  verb: 'inserting rows', where: a.sheetName + '!rows ' + span(a) }),
        delete_rows:    (a) => ({ op: { type: 'deleteRows', sheetName: a.sheetName, index: a.index, count: a.count || 1 },
                                  verb: 'deleting rows', where: a.sheetName + '!rows ' + span(a) }),
        insert_columns: (a) => ({ op: { type: 'insertColumns', sheetName: a.sheetName, index: a.index, count: a.count || 1 },
                                  verb: 'inserting columns', where: a.sheetName + '!cols ' + span(a) }),
        delete_columns: (a) => ({ op: { type: 'deleteColumns', sheetName: a.sheetName, index: a.index, count: a.count || 1 },
                                  verb: 'deleting columns', where: a.sheetName + '!cols ' + span(a) }),
        add_sheet:      (a) => ({ op: { type: 'addSheet', name: a.name },
                                  verb: 'adding sheet', where: a.name }),
        delete_sheet:   (a) => ({ op: { type: 'deleteSheet', sheetName: a.sheetName },
                                  verb: 'deleting sheet', where: a.sheetName }),
        merge_cells:    (a) => ({ op: { type: 'mergeCells', sheetName: a.sheetName, a1: a.a1, mergeType: a.mergeType || 'all' },
                                  verb: 'merging', where: a.sheetName + '!' + a.a1 }),
        unmerge_cells:  (a) => ({ op: { type: 'unmergeCells', sheetName: a.sheetName, a1: a.a1 },
                                  verb: 'unmerging', where: a.sheetName + '!' + a.a1 }),
        sort_range:     (a) => ({ op: { type: 'sortRange', sheetName: a.sheetName, a1: a.a1, by: a.by },
                                  verb: 'sorting', where: a.sheetName + '!' + a.a1 }),
        set_column_width: (a) => ({ op: { type: 'setColumnWidth', sheetName: a.sheetName, index: a.index, count: a.count || 1, width: a.width },
                                  verb: 'resizing', where: a.sheetName + '!cols ' + span(a) }),
        set_row_height: (a) => ({ op: { type: 'setRowHeight', sheetName: a.sheetName, index: a.index, count: a.count || 1, height: a.height },
                                  verb: 'resizing', where: a.sheetName + '!rows ' + span(a) }),
        freeze_panes:   (a) => ({ op: { type: 'freezePanes', sheetName: a.sheetName, rows: a.rows, cols: a.cols },
                                  verb: 'freezing panes', where: a.sheetName }),
        rename_sheet:   (a) => ({ op: { type: 'renameSheet', sheetName: a.sheetName, newName: a.newName },
                                  verb: 'renaming', where: a.sheetName + ' → ' + a.newName }),
        hide_rows:      (a) => ({ op: { type: 'hideRows', sheetName: a.sheetName, index: a.index, count: a.count || 1 },
                                  verb: 'hiding', where: a.sheetName + '!rows ' + span(a) }),
        show_rows:      (a) => ({ op: { type: 'showRows', sheetName: a.sheetName, index: a.index, count: a.count || 1 },
                                  verb: 'unhiding', where: a.sheetName + '!rows ' + span(a) }),
        hide_columns:   (a) => ({ op: { type: 'hideColumns', sheetName: a.sheetName, index: a.index, count: a.count || 1 },
                                  verb: 'hiding', where: a.sheetName + '!cols ' + span(a) }),
        show_columns:   (a) => ({ op: { type: 'showColumns', sheetName: a.sheetName, index: a.index, count: a.count || 1 },
                                  verb: 'unhiding', where: a.sheetName + '!cols ' + span(a) }),
        hide_sheet:     (a) => ({ op: { type: 'hideSheet', sheetName: a.sheetName },
                                  verb: 'hiding sheet', where: a.sheetName }),
        show_sheet:     (a) => ({ op: { type: 'showSheet', sheetName: a.sheetName },
                                  verb: 'unhiding sheet', where: a.sheetName }),
        set_borders:    (a) => ({ op: { type: 'setBorders', sheetName: a.sheetName, a1: a.a1,
                                        top: a.top, bottom: a.bottom, left: a.left, right: a.right,
                                        vertical: a.vertical, horizontal: a.horizontal,
                                        color: a.color, style: a.style },
                                  verb: 'bordering', where: a.sheetName + '!' + a.a1 }),
        set_validation: (a) => ({ op: { type: 'setValidation', sheetName: a.sheetName, a1: a.a1, rule: a.rule },
                                  verb: 'setting validation', where: a.sheetName + '!' + a.a1 }),
        set_conditional_format: (a) => ({ op: { type: 'setConditionalFormat', sheetName: a.sheetName, a1: a.a1, rule: a.rule },
                                  verb: 'adding conditional format', where: a.sheetName + '!' + a.a1 }),
        clear_conditional_formats: (a) => ({ op: { type: 'clearConditionalFormats', sheetName: a.sheetName },
                                  verb: 'clearing conditional formats', where: a.sheetName }),
        set_note:       (a) => ({ op: { type: 'setNote', sheetName: a.sheetName, a1: a.a1, note: a.note },
                                  verb: 'noting', where: a.sheetName + '!' + a.a1 }),
        set_named_range: (a) => ({ op: { type: 'setNamedRange', name: a.name, sheetName: a.sheetName, a1: a.a1 },
                                  verb: 'naming range', where: a.name + ' → ' + a.sheetName + '!' + a.a1 }),
        delete_named_range: (a) => ({ op: { type: 'deleteNamedRange', name: a.name },
                                  verb: 'deleting named range', where: a.name }),
        duplicate_sheet: (a) => ({ op: { type: 'duplicateSheet', sheetName: a.sheetName, newName: a.newName },
                                  verb: 'duplicating sheet', where: a.sheetName }),
      };

      function postOpResult(callId, result) {
        return fetch(DAEMON + '/op-result', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ callId, result }),
        }).catch(() => {});
      }

      // ---- the web-access gate ---------------------------------------------
      //
      // {type:'gate', gateId, tool, detail}: Claude wants to search or fetch,
      // and the CLI-side hook is holding the call until a human answers. This
      // is a SECURITY boundary, not a courtesy — untrusted cell content plus
      // outbound network is an exfiltration channel, so the card shows the
      // full URL or query, exactly what would leave the machine. No answer
      // means no: the daemon denies on timeout, so a closed sidebar is safe.

      function postGateResult(gateId, allow) {
        return fetch(DAEMON + '/gate-result', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gateId: gateId, allow: allow }),
        }).catch(() => {});
      }

      function handleGate(ev, container) {
        const node = container.appendChild(document.createElement('div'));
        node.className = 'op ask';
        const d = ev.detail || {};
        const what = ev.tool === 'WebSearch'
          ? 'search the web for<br><span class="a1">' + esc(d.query || '') + '</span>'
          : 'fetch<br><span class="a1" style="word-break:break-all">' + esc(d.url || '') + '</span>';
        node.innerHTML = 'Claude wants to ' + what +
          '<div class="why">Check it for anything from your sheet you would not share.</div>';

        const yes = document.createElement('button');
        yes.textContent = 'Allow';
        yes.onclick = () => {
          node.className = 'op done';
          node.innerHTML = (ev.tool === 'WebSearch' ? 'searched ' : 'fetched ') +
            '<span class="a1" style="word-break:break-all">' + esc(d.query || d.url || '') + '</span>';
          postGateResult(ev.gateId, true);
        };
        const no = document.createElement('button');
        no.textContent = 'Skip';
        no.style.marginLeft = '6px';
        no.onclick = () => {
          node.className = 'op';
          node.innerHTML = 'skipped a web request';
          postGateResult(ev.gateId, false);
        };
        node.appendChild(document.createElement('br'));
        node.appendChild(yes);
        node.appendChild(no);
      }

      function handleToolCall(ev, container) {
        const node = container.appendChild(document.createElement('div'));
        node.className = 'op';
        const where = (ev.args && (ev.args.sheetName || '')) +
                      (ev.args && ev.args.a1 ? '!' + ev.args.a1 : '');

        if (ev.name === 'read_range') {
          node.innerHTML = 'reading <span class="a1">' + esc(where || 'active sheet') + '</span>…';
          google.script.run
            .withSuccessHandler((c) => {
              ctx = c;   // a read refreshes our own picture of the sheet too
              rememberRead(c);
              node.className = 'op done';
              node.innerHTML = 'read <span class="a1">' +
                esc(c.active.sheetName + '!' + c.active.a1) + '</span>' +
                (c.active.truncated ? ' <i>(truncated)</i>' : '');
              postOpResult(ev.callId, {
                sheets: c.sheets,
                sheetName: c.active.sheetName,
                a1: c.active.a1,
                truncated: c.active.truncated,
                values: c.active.values,
                formulas: c.active.formulas,
                merges: c.active.merges,
              });
            })
            .withFailureHandler((err) => {
              node.className = 'op err';
              node.textContent = 'read failed: ' + err.message;
              postOpResult(ev.callId, { error: String(err.message || err) });
            })
            .getContext({ sheetName: ev.args && ev.args.sheetName, a1: ev.args && ev.args.a1 });
          return;
        }

        const build = TOOL_OPS[ev.name];
        if (!build) {
          node.className = 'op err';
          node.textContent = 'unknown tool: ' + ev.name;
          postOpResult(ev.callId, { error: 'unknown tool: ' + ev.name });
          return;
        }

        const planned = build(ev.args || {});
        node.innerHTML = esc(planned.verb) + ' <span class="a1">' + esc(planned.where) + '</span>…';
        submitToolOp(ev.callId, planned.op, node, []);
      }

      function submitToolOp(callId, op, node, confirmed) {
        google.script.run
          .withSuccessHandler((res) => {
           try {
            // Accounts for the write we just made, so the next op in this turn
            // is not rejected for our own edit.
            if (res.guard) guardState = res.guard;

            const r = (res.results && res.results[0]) || res;

            // The guard fired: a person edited mid-turn and nothing was
            // written. Tell Claude to re-read rather than letting it retry
            // blind against a sheet it no longer understands.
            if (res.error && res.error.code === 'CONTEXT_STALE') {
              node.className = 'op ask';
              node.innerHTML = '<b>Paused — the sheet changed.</b><div class="why">' +
                esc(res.error.message) + '</div>';
              guardState = null;   // forced to read again before the next write
              postOpResult(callId, { error: 'CONTEXT_STALE: ' + res.error.message });
              return;
            }

            if (r.needsConfirmation) {
              node.className = 'op ask';
              node.innerHTML = 'Claude wants to <b>' + esc(r.reason) + '</b> in ' +
                '<span class="a1">' + esc(r.target) + '</span>.' +
                '<div class="why">It can be undone afterwards.</div>';
              const yes = document.createElement('button');
              yes.textContent = 'Do it';
              yes.onclick = () => {
                node.className = 'op';
                node.innerHTML = 'applying…';
                submitToolOp(callId, op, node, [op.opId || r.opId]);
              };
              const no = document.createElement('button');
              no.textContent = 'Skip';
              no.style.marginLeft = '6px';
              no.onclick = () => {
                node.className = 'op';
                node.innerHTML = 'skipped <span class="a1">' + esc(r.target) + '</span>';
                postOpResult(callId, { skipped: true,
                  message: 'The user chose not to apply this change (' + r.reason + '). Respect that decision.' });
              };
              node.appendChild(document.createElement('br'));
              node.appendChild(yes);
              node.appendChild(no);
              // opId must survive to the confirmed re-submit
              op.opId = r.opId;
              return;
            }

            if (!r.ok) {
              node.className = 'op err';
              node.innerHTML = '<b>' + esc(r.error.code) + '</b><br>' + esc(r.error.message);
              postOpResult(callId, { error: r.error.code + ': ' + r.error.message });
              return;
            }

            node.className = 'op done';
            node.innerHTML = esc(verb(r.type)) + ' <span class="a1">' + esc(r.applied) + '</span>' +
              (r.restorable ? '' : ' <i>(too large to undo)</i>');
            if (r.restorable) {
              const b = document.createElement('button');
              b.textContent = 'Undo';
              b.onclick = () => undo(r.opId, node);
              node.appendChild(document.createElement('br'));
              node.appendChild(b);
            }
            postOpResult(callId, { ok: true, applied: r.applied, restorable: r.restorable });
           } catch (e) {
            // Answer anyway. A cosmetic bug must never hold a turn open.
            node.className = 'op err';
            node.textContent = 'Sidebar error: ' + (e && e.message || e);
            postOpResult(callId, { error: 'the sidebar could not handle the result: ' + (e && e.message || e) });
           }
          })
          .withFailureHandler((err) => {
            node.className = 'op err';
            node.textContent = 'Apps Script error: ' + err.message;
            postOpResult(callId, { error: String(err.message || err) });
          })
          .applyOps({ ops: [op], confirmed: confirmed, guard: guardState,
                      askBefore: askBefore });
      }

      function verb(type) {
        return type === 'clear' ? 'cleared'
             : type === 'setFormats' ? 'formatted'
             : type === 'setFormulas' ? 'set formulas in'
             : type === 'insertRows' || type === 'insertColumns' ? 'inserted'
             : type === 'deleteRows' || type === 'deleteColumns' ? 'deleted'
             : type === 'addSheet' ? 'added'
             : type === 'deleteSheet' ? 'deleted'
             : type === 'mergeCells' ? 'merged'
             : type === 'unmergeCells' ? 'unmerged'
             : type === 'sortRange' ? 'sorted'
             : type === 'setColumnWidth' || type === 'setRowHeight' ? 'resized'
             : type === 'freezePanes' ? 'froze'
             : type === 'renameSheet' ? 'renamed'
             : type === 'hideRows' || type === 'hideColumns' || type === 'hideSheet' ? 'hid'
             : type === 'showRows' || type === 'showColumns' || type === 'showSheet' ? 'unhid'
             : type === 'setBorders' ? 'bordered'
             : type === 'setValidation' ? 'set validation on'
             : type === 'setConditionalFormat' ? 'added rule to'
             : type === 'clearConditionalFormats' ? 'cleared rules on'
             : type === 'setNote' ? 'noted'
             : type === 'setNamedRange' ? 'named'
             : type === 'deleteNamedRange' ? 'unnamed'
             : type === 'duplicateSheet' ? 'duplicated'
             : 'wrote';
      }

      // Undo can refuse: restoring a range that a later change also touched would
      // revert that later change too, without saying so. Offer the override
      // rather than either hiding the option or silently taking the risk.
      function undo(opId, node, force) {
        const previous = node.innerHTML;
        node.innerHTML = 'undoing…';
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.ok === false && res.code === 'BLOCKED_BY_LATER_EDIT') {
              node.className = 'op ask';
              node.innerHTML = esc(res.message);
              const anyway = document.createElement('button');
              anyway.textContent = 'Undo anyway';
              anyway.onclick = () => { node.innerHTML = previous; undo(opId, node, true); };
              node.appendChild(document.createElement('br'));
              node.appendChild(anyway);
              return;
            }
            node.className = 'op';
            node.innerHTML = 'restored <span class="a1">' + esc(res.restored) + '</span>';
            refreshContext();
          })
          .withFailureHandler((err) => {
            node.className = 'op err';
            node.textContent = 'Undo failed: ' + err.message;
          })
          .undoOp(opId, Boolean(force));
      }

      // ---- context ----------------------------------------------------------
      function refreshContext() {
        return new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((c) => { ctx = c; rememberRead(c); resolve(c); })
            .withFailureHandler(() => resolve(null))
            .getContext({});
        });
      }

      // ---- one turn ---------------------------------------------------------
      // Lets New chat abandon a turn that is waiting on something that will
      // never arrive, instead of leaving the composer disabled.
      let turnAbort = null;

      async function send() {
        const text = $('prompt').value.trim();
        if (!text) return;
        $('prompt').value = '';
        $('send').disabled = true;
        addMsg('user', '<b>You</b><div class="bubble">' + esc(text) + '</div>');

        await refreshContext();
        const node = addMsg('claude', '<b>Claude</b><div class="bubble"></div>');
        const bubble = node.querySelector('.bubble');
        let acc = '';

        try {
          turnAbort = new AbortController();
          const res = await fetch(DAEMON + '/turn', {
            method: 'POST',
            signal: turnAbort.signal,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              spreadsheetId: ctx && ctx.spreadsheetId,
              spreadsheetName: ctx && ctx.spreadsheetName,
              prompt: text,
              context: ctx,
            }),
          });

          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = '';

          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const frames = buf.split('\n\n');
            buf = frames.pop();

            for (const frame of frames) {
              const line = frame.replace(/^data: /, '').trim();
              if (!line) continue;
              let ev;
              try { ev = JSON.parse(line); } catch { continue; }

              if (ev.type === 'pairing_required') {
                bubble.innerHTML = '<i>Waiting for approval in the local app — ' +
                  'open <span class="a1">' + DAEMON + '</span> and allow this spreadsheet.</i>';
              } else if (ev.type === 'paired') {
                bubble.innerHTML = '';
              } else if (ev.type === 'tool_call') {
                handleToolCall(ev, node);
              } else if (ev.type === 'settings') {
                askBefore = ev.askBefore || 'destructive';
              } else if (ev.type === 'gate') {
                handleGate(ev, node);
              } else if (ev.type === 'text') {
                acc += ev.delta;
                bubble.textContent = acc;
              } else if (ev.type === 'error') {
                bubble.innerHTML = '<span style="color:var(--bad)"><b>' +
                  esc(ev.code) + '</b><br>' + esc(ev.message) + '</span>';
              }
            }
          }

        } catch (e) {
          if (e && e.name === 'AbortError') {
            bubble.innerHTML = '<i>Stopped.</i>';
          } else {
            bubble.innerHTML = '<span style="color:var(--bad)">Could not reach the local app. ' +
              'Is it running? ' + esc(e.message) + '</span>';
          }
        } finally {
          turnAbort = null;
          $('send').disabled = false;
        }
      }

      // ---- history ----------------------------------------------------------
      function renderHistory(items) {
        $('hist').innerHTML = items.length
          ? items.map((h) => `
              <div class="item">
                <span class="a1 ${h.undone ? 'undone' : ''}">${esc(h.target)}</span>
                <span class="status">${esc(h.at.replace('T',' ').slice(5,16))}</span>
                ${h.restorable && !h.undone
                  ? `<button onclick="histUndo('${esc(h.opId)}')">Undo</button>` : ''}
              </div>`).join('')
          : '<div class="status">No changes yet.</div>';
      }
      function histUndo(opId, force) {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.ok === false && res.code === 'BLOCKED_BY_LATER_EDIT') {
              if (confirm(res.message + '\n\nUndo it anyway?')) return histUndo(opId, true);
              return;
            }
            loadHistory();
          })
          .undoOp(opId, Boolean(force));
      }
      function loadHistory() {
        google.script.run.withSuccessHandler(renderHistory).getHistory();
      }

      // A turn now continues the previous one, so the conversation needs an end:
      // otherwise it grows without bound and yesterday's context follows the user
      // into an unrelated question. Clears the transcript on the daemon side; the
      // sheet's edit history is separate and untouched.
      $('newChat').onclick = async () => {
        // Recover the UI first and unconditionally. New chat is the escape hatch
        // from a wedged turn, so it has to work when nothing else does — before
        // any check that could return early, and before any await that could throw.
        if (turnAbort) { turnAbort.abort(); turnAbort = null; }
        $('send').disabled = false;
        guardState = null;
        $('log').innerHTML = '';

        if (!ctx || !ctx.spreadsheetId) {
          addMsg('user', '<i>New conversation.</i>');
          return;
        }
        try {
          await fetch(DAEMON + '/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ spreadsheetId: ctx.spreadsheetId }),
          });
          addMsg('user', '<i>New conversation. Claude no longer remembers the turns above.</i>');
        } catch {
          addMsg('user', '<i>Cleared here, but the local app could not be reached to reset its side.</i>');
        }
      };

      $('toggleHist').onclick = () => {
        const showing = $('hist').style.display !== 'none';
        $('hist').style.display = showing ? 'none' : 'block';
        $('log').style.display = showing ? 'block' : 'none';
        $('banner').style.display = showing ? 'block' : 'none';
        if (!showing) loadHistory();
      };

      $('send').onclick = send;
      // Enter sends; Shift+Enter makes a newline. Chat convention, and the
      // textarea would otherwise insert a line break before send() ever ran.
      $('prompt').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.shiftKey) return;
        // Mid-composition Enter commits an IME candidate — never a send.
        if (e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        send();
      });

      checkDaemon();
      refreshContext();
      setInterval(checkDaemon, 10000);
    </script>
  </body>
</html>
